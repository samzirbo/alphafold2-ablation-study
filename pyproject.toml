[project]
name = "alphafold2-ablation-study"
version = "0.1.0"
description = "Ablation studies on AlphaFold2 inputs for sampling alternative protein conformations"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=1.4.0,<2.0.0",
    "biopython>=1.84,<1.86",
    "colabfold[alphafold-minus-jax] @ git+https://github.com/sokrypton/ColabFold",
    "ipykernel>=7.2.0",
    "jax[cuda12]>=0.4.26,<0.5; sys_platform == 'linux'",
    "jax>=0.4.26,<0.5; sys_platform != 'linux'",
    "matplotlib>=3.8.4",
    "numpy>=2.0.2",
    "pandas>=2.2.2",
    "prody>=2.6.1",
    "py3Dmol>=2.0.1",
    "pydrive2>=1.21.1",
    "requests>=2.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tmtools>=0.3.0",
    "tqdm>=4.62.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
